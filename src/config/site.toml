[config.site]
title = "navfolio"
description = "A personal navigation portfolio starter built with Astro."
pageTitle = "navfolio | Digital Publication Space"
pageDescription = "A calm AI-native personal publication space for notes, links, and writing."
url = "https://astro.navfolio.site"
repository = "https://github.com/dodolalorc/astro-navfolio"
footerNote = "Released as an open-source starter."

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# Native UI language. Supported value: en. Unknown values fall back to en.
lang = "en"

[config.fonts]
# English / code-style UI font
en = "Maple Mono"
code = "Monaco"
# Built-in options include ChillRoundM and LXGW WenKai
# CJK reading font
zh = "ChillRoundM"
# Full CJK font file
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing notes"
kicker = "Notebook archive"
subtitle = "Notes from the margins."
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# date-fns date format template.
dateFormat = "yyyy-MM-dd"
# Metadata separator. Use symbols like "|" or "/", or the special value "icon".
metadataSeparator = "icon"
# Post list cover style: "card" keeps a bordered thumbnail; "mask" blends the image to the right.
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Small tools and site systems."
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.media]
title = "Media"
subtitle = "Books, films, shows, and albums I've taken in — plus a note on how they landed."
note = "One page for books, movies, series, albums, and podcasts."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "navfolio"
handle = "@navfolio"
role = "A Cat Developer"
email = "hello@navfolio.site"
website = "https://astro.navfolio.site/"
github = "https://github.com/dodolalorc/astro-navfolio"
avatar = "/images/logo-thin.webp"

[[config.topNav.links]]
label = "Home"
href = "/"

[[config.topNav.links]]
label = "Blog"
href = "/blog"

[[config.topNav.links]]
label = "Projects"
