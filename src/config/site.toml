[config.site]
title = "calvintvu"
description = "Calvin Vu's personal site."
pageTitle = "Calvin Vu"
pageDescription = "Calvin Vu's personal site: notes, projects, and writing."
url = "https://calvintvu.github.io"
repository = "https://github.com/calvintvu/calvintvu.github.io"
footerNote = ""

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft, teal-soft
palette = "teal-soft"
# Native UI language. Supported value: en. Unknown values fall back to en.
lang = "en"

[config.fonts]
# English / code-style UI font
en = "Nordwand Mono"
code = "Nordwand Mono"
# Built-in options include ChillRoundM and LXGW WenKai
# CJK reading font
zh = "ChillRoundM"
# Full CJK font file
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "notes"
kicker = "Notebook archive"
postsPerPage = 6
# date-fns date format template.
dateFormat = "yyyy-MM-dd"
# Metadata separator. Use symbols like "|" or "/", or the special value "icon".
metadataSeparator = "·"
# Post list cover style: "card" keeps a bordered thumbnail; "mask" blends the image to the right.
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "projects"
kicker = "Project shelf"
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.media]
title = "media"
subtitle = "i love to produce edm and edit content. please check out my music and videos!"
note = "Singles I've released and videos from my travels."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "calvin vu"
handle = "@calvintvu"
role = ""
email = "hello@navfolio.site"
website = "https://calvintvu.github.io/"
github = "https://github.com/calvintvu"
avatar = "https://github.com/calvintvu.png"

[[config.topNav.links]]
label = "home"
href = "/"

[[config.topNav.links]]
label = "notes"
href = "/notes"

[[config.topNav.links]]
label = "projects"
module = "projects"

[[config.topNav.links]]
label = "media"
href = "/media"

[[config.topNav.links]]
label = "about"
href = "/about"


[config.home.intro]
# Each line is a paragraph; [text](url) makes a link.
body = [
  "software engineer & digital creator. currently @ [centauri-ai](https://centauri-ai.tech/).",
]

[config.home.github]
# Contributions are fetched from github.com at build time; leave empty to hide the graph.
username = "calvintvu"
weeks = 53

[[config.home.links]]
label = "GitHub"
icon = "github"
tooltip = "https://github.com/calvintvu"
copy = false

[[config.home.links]]
label = "RSS"
icon = "rss"
tooltip = "/rss.xml"
copy = false
